[package]
name = "nidps-engine"
version = "0.1.0"
edition = "2021"
description = "Compiled inline prevention engine with decision-parity to the Python detector"
license = "MIT"

[[bin]]
name = "nidps-engine"
path = "src/main.rs"

[lib]
name = "nidps_engine"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
