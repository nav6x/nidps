name: engine

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine-rs
    steps:
      - uses: actions/checkout@v4

      - name: Build (release, locked)
        run: cargo build --release --locked

      - name: Unit tests
        run: cargo test --release --locked
