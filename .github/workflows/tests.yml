name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch benchmark datasets
        run: bash scripts/fetch_data.sh

      - name: Train models (required by the data-dependent test suite)
        run: python src/train.py --dataset nsl-kdd unsw-nb15

      - name: Run the leak-free test suite
        run: python -m pytest tests/ -v
